services:
  veemo:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:4210:4210"
    environment:
      VEEMO_ADMIN_TOKEN: ${VEEMO_ADMIN_TOKEN:?set VEEMO_ADMIN_TOKEN}
      VEEMO_REGISTRATION_KEY: ${VEEMO_REGISTRATION_KEY:?set VEEMO_REGISTRATION_KEY}
    volumes:
      - veemo-data:/app/data
volumes:
  veemo-data: